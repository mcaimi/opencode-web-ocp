---
services:
  # OpenChamber AI Assistant
  agent:
    build:
      context: .
      dockerfile: Containerfile.openchamber
    container_name: openchamber
    ports:
      - "8088:8080"      # Web UI / REST API
    volumes:
      - openchamber-workspace:/workspace
    environment:
      - MODEL_NAME=<MODEL_PLACEHOLDER>
      - INFERENCE_ENDPOINT=<INFERENCE_ENDPOINT>
      - APIKEY=<APIKEY_PLACEHOLDER>
      - SERVER_PASSWORD=<SERVER_PASSWORD_PLACEHOLDER>
      - HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - openchamber-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  openchamber-workspace:
    driver: local

networks:
  openchamber-network:
    driver: bridge
