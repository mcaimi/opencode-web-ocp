replicaCount: 1

image:
  repository: quay.io/marcocaimi/opencode-web-ocp
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: "opencode-sa"
  annotations: {}

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

route:
  enabled: true
  # hostname: opencode.apps.example.com
  hostname: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

persistence:
  enabled: false
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /workspace

openchamber:
  persistence:
    enabled: false
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    mountPath: /home/opencode/.config/openchamber

# opencode state: opencode.db (sessions, provider credentials) and logs
opencode:
  persistence:
    enabled: false
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    mountPath: /home/opencode/.local/share/opencode

# SERVER_PASSWORD (UI password) and APIKEY (vLLM API key) are read from a Secret.
# Set existingSecret to use a pre-created one, otherwise the chart creates it from the values below.
auth:
  existingSecret: ""
  serverPasswordKey: server-password
  apiKeyKey: api-key
  serverPassword: "redhat"
  apiKey: ""

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

env:
  # the container runs unprivileged and cannot update binaries in place
  - name: OPENCODE_AUTOUPDATE
    value: "false"
  - name: API_ONLY
    value: "0"
  - name: INFERENCE_ENDPOINT
    value: "http://inference.apps.openshift.local"
  - name: MODEL_NAME
    value: "qwen-coder"

proxy:
  enabled: false
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""
  # If noProxy is not specified and proxy is enabled, a default set of exclusions will be used:
  # - localhost, 127.0.0.1, .local
  # - .svc, .svc.cluster.local (Kubernetes services)
  # - Kubernetes service CIDR and pod CIDR (if specified)
  # Additional custom domains can be added to the default list
  additionalNoProxy: []
  # Kubernetes cluster configuration for auto-generating NO_PROXY
  kubernetes:
    serviceCIDR: "10.96.0.0/12"
    podCIDR: "10.244.0.0/16"
    apiServer: "kubernetes.default.svc"

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

nodeSelector: {}

tolerations: []

affinity: {}

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
