{{- if .Values.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opencode-web.fullname" . }}
  labels:
    {{- include "opencode-web.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
{{- end }}
{{- if .Values.dataPersistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opencode-web.fullname" . }}-state
  labels:
    {{- include "opencode-web.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.dataPersistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.dataPersistence.size }}
  {{- if .Values.dataPersistence.storageClassName }}
  storageClassName: {{ .Values.dataPersistence.storageClassName }}
  {{- end }}
{{- end }}
