{{- if .Values.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opencode-web.fullname" . }}
  labels:
    {{- include "opencode-web.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
{{- end }}
---
{{- if .Values.openchamber.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opencode-web.fullname" . }}-openchamber
  labels:
    {{- include "opencode-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: openchamber
spec:
  accessModes:
    - {{ .Values.openchamber.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.openchamber.persistence.size }}
  {{- if .Values.openchamber.persistence.storageClassName }}
  storageClassName: {{ .Values.openchamber.persistence.storageClassName }}
  {{- end }}
{{- end }}
---
{{- if .Values.opencode.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opencode-web.fullname" . }}-opencode
  labels:
    {{- include "opencode-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: opencode
spec:
  accessModes:
    - {{ .Values.opencode.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.opencode.persistence.size }}
  {{- if .Values.opencode.persistence.storageClassName }}
  storageClassName: {{ .Values.opencode.persistence.storageClassName }}
  {{- end }}
{{- end }}
