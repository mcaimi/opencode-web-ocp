{{- if not .Values.auth.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opencode-web.fullname" . }}
  labels:
    {{- include "opencode-web.labels" . | nindent 4 }}
type: Opaque
stringData:
  server-password: {{ .Values.auth.serverPassword | quote }}
  api-key: {{ .Values.auth.apiKey | quote }}
{{- end }}
